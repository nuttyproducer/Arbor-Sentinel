name: Security / privacy review
description: Request or submit a security or privacy review for the platform, dependencies, or configuration
labels: [security-review, privacy-review, needs-triage]
title: "[SECURITY/PRIVACY REVIEW] "
body:
  - type: markdown
    attributes:
      value: |
        ## Security / privacy review

        Use this template to request a security or privacy review or to submit
        findings for Arbor Sentinel.

        **This is not a partnership programme.** Submitting a security review
        does not create a partnership, endorsement, affiliation, employment,
        or official representation relationship.

        **Do not submit sensitive, confidential, or private information through
        this public form.** If you have found a security vulnerability, follow
        [SECURITY.md](../blob/main/SECURITY.md) instead. Do not disclose
        vulnerabilities publicly before they are fixed.

        **This form is for review requests and non-sensitive findings only.**
        Vulnerability reports should use the private reporting channel.

  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      description: Are you requesting a review or submitting findings?
      options:
        - Requesting a security/privacy review
        - Submitting security/privacy review findings (non-sensitive only)
    validations:
      required: true

  - type: dropdown
    id: review_area
    attributes:
      label: Review area
      description: What area needs review?
      multiple: true
      options:
        - CSP / security headers
        - Dependency audit (npm audit, supply chain)
        - Static analysis / code review
        - Privacy posture (data collection, storage, exposure)
        - External request audit (third-party domains)
        - Authentication / access control (if applicable)
        - secrets / credential management
        - Build / CI pipeline security
        - Deployment configuration
        - security.txt and vulnerability reporting
        - Other (specify in scope)
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Review scope
      description: What specifically needs review? Describe the area, configuration, or code.
      placeholder: |
        - Review CSP header configuration after adding a new external resource
        - Audit npm dependencies for known vulnerabilities before release
        - Check that no personal data is exposed in the static build output
        - Verify external links use rel="noopener noreferrer"
    validations:
      required: true

  - type: textarea
    id: findings
    attributes:
      label: Findings (if submitting a review — non-sensitive only)
      description: Report findings for each check performed. Do not include exploit details, secrets, or vulnerability specifics.
      placeholder: |
        ### CSP headers
        - [ ] CSP present on all pages — [Pass / Fail]
        - [ ] No unsafe-inline in script-src — [Pass / Fail]
        - [ ] frame-ancestors 'none' set — [Pass / Fail]

        ### Dependencies
        - [ ] npm audit reports zero critical/high — [Pass / Fail — note count if not]
        - [ ] Dependabot alerts reviewed — [Pass / Fail]

        ### Privacy
        - [ ] No external requests (static beta) — [Pass / Fail — list any found]
        - [ ] No personal data in build output — [Pass / Fail]
        - [ ] External links use rel="noopener noreferrer" — [Pass / Fail]

        ### Configuration
        - [ ] security.txt accessible at /.well-known/security.txt — [Pass / Fail]
        - [ ] robots.txt correctly configured — [Pass / Fail]
        - [ ] HSTS header present — [Pass / Fail]
    validations:
      required: false

  - type: textarea
    id: issues
    attributes:
      label: Issues found (non-sensitive descriptions only)
      description: Describe each issue in general terms. Do not include exploit details, vulnerable code paths, or secrets.
      placeholder: |
        ### Issue 1 (severity: high)
        **Area:** CSP configuration
        **Issue:** The CSP header is missing on [specific page or condition]. This could allow [general category of risk].
        **Suggested fix:** [General fix approach — do not include implementation details that could be exploited]

        ### Issue 2 (severity: medium)
        ...
    validations:
      required: false

  - type: textarea
    id: dependency_findings
    attributes:
      label: Dependency audit results (if applicable)
      description: Summary of npm audit or dependency check results. Do not list specific vulnerable versions.
      placeholder: |
        - Critical: 0
        - High: 0
        - Moderate: [N] — [general description without version details]
        - Low: [N]
    validations:
      required: false

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome (if submitting findings)
      description: What is the overall outcome of this review?
      options:
        - Not applicable (requesting a review)
        - Approved — no security/privacy issues found
        - Changes requested — see findings above
        - Blocked — critical security/privacy issues prevent publication
    validations:
      required: true

  - type: textarea
    id: unresolved_risk
    attributes:
      label: Unresolved security/privacy risk
      description: Are there any security or privacy concerns that remain unresolved?
      placeholder: |
        - SRI hashes not generated for bundled assets (Vite limitation). Monitor for tooling support.
        - No WAF configured at the project level. Relying on deployment platform defaults.
    validations:
      required: false

  - type: input
    id: reviewer_role
    attributes:
      label: Reviewer role (for public metadata)
      description: How should your role be described publicly? (e.g., "security reviewer"). Leave blank if you prefer not to be credited.
      placeholder: security reviewer
    validations:
      required: false

  - type: dropdown
    id: name_permission
    attributes:
      label: Name credit permission
      description: Do you permit your name to appear in public metadata for this review?
      options:
        - No — use role description only
        - Yes — I will provide my name separately to the maintainer
    validations:
      required: true

  - type: dropdown
    id: visibility
    attributes:
      label: Visibility preference
      description: How much of this review should be publicly visible?
      options:
        - Public metadata only (review type, date, outcome, role — no detailed findings)
        - Full report public (all findings public; name still requires separate permission)
        - Private (nothing publicly attributed)
    validations:
      required: true

  - type: input
    id: commit_version
    attributes:
      label: Commit or version reviewed
      description: Which version was reviewed?
      placeholder: abc123def456 or version 1.2.0
    validations:
      required: false

  - type: checkboxes
    id: declarations
    attributes:
      label: Reviewer declarations
      description: Please confirm the following before submitting.
      options:
        - label: This submission does NOT contain security vulnerability details, exploit code, secrets, tokens, or credentials
          required: true
        - label: If I found a security vulnerability, I have reported it privately following SECURITY.md and have NOT included it in this public issue
          required: true
        - label: I have disclosed any conflicts of interest to the maintainer (see reviewer-conflict-of-interest.md)
          required: true
        - label: I understand that this review does not create a partnership, endorsement, affiliation, employment, or official representation relationship with Arbor Sentinel
          required: true
        - label: I understand that I may describe my contribution but may not speak for the project without written authorisation
          required: true
        - label: I have not submitted, collected, or stored any private personal data, confidential institutional material, or sensitive evidence as part of this review
          required: true
        - label: This submission does not contain private personal information, sensitive evidence, private testimony, or confidential institutional material
          required: true

  - type: markdown
    attributes:
      value: |
        ---

        **⚠️ Security vulnerabilities must be reported privately.**
        Do not use this public template for vulnerability disclosure.
        Follow [SECURITY.md](../blob/main/SECURITY.md) or use GitHub's
        [private vulnerability reporting](https://github.com/nuttyproducer/arbor-sentinel/security/advisories/new)
        if enabled.

        **Review evidence:** If this review leads to changes, a review evidence
        record will be created following the [Review Evidence Format](../blob/main/docs/review-evidence-format.md).

        **Questions?** See the [Reviewer Guide](../blob/main/docs/reviewer-guide.md)
        and [Static Beta Security Checklist](../blob/main/docs/static-beta-security-checklist.md).
