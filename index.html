<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101828" />
    <!-- Public static content is reviewed and ready for indexing (M7-06).
         Admin and beta routes stay noindex via per-route metadata. -->
    <meta name="robots" content="index,follow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    />

    <!-- Static fallback meta tags — overwritten by DocumentHead on each route. -->
    <title>Accountability Atlas — Building public infrastructure against genocide and mass atrocities.</title>
    <meta
      name="description"
      content="An open-source platform for organizing verified public evidence, tracking legal and political responsibility, and helping people take lawful action — starting with Gaza and the wider regional crisis."
    />

    <meta property="og:title" content="Accountability Atlas — Building public infrastructure against genocide and mass atrocities." />
    <meta
      property="og:description"
      content="Evidence for protection. Action for accountability. Starting with Gaza and the wider regional crisis."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data — Organization + WebSite. No claims beyond what the
         site publishes; corrected via the /corrections route. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Accountability Atlas",
            "url": "https://accountabilityatlas.org",
            "description": "Open-source civic-technology platform for organizing verified public evidence, tracking legal and political responsibility, and helping people take lawful action — starting with Gaza and the wider regional crisis.",
            "logo": "/social-preview.png"
          },
          {
            "@type": "WebSite",
            "name": "Accountability Atlas",
            "url": "https://accountabilityatlas.org",
            "description": "Verified evidence. Lawful pressure. Civilian protection."
          }
        ]
      }
    </script>

    <!-- Fonts are self-hosted via @fontsource — no external font requests. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
