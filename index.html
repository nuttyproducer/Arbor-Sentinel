<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101828" />
    <!-- Public static content is reviewed and ready for indexing (M7-06).
         Admin and beta routes stay noindex via per-route metadata. -->
    <meta name="robots" content="index,follow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co https://corsproxy.io https://api.allorigins.win; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    />

    <!-- Static fallback meta tags — overwritten by DocumentHead on each route. -->
    <title>Arbor Sentinel — Building public infrastructure against genocide and mass atrocities.</title>
    <meta
      name="description"
      content="An open-source platform for organizing verified public evidence, tracking legal and political responsibility, and helping people take lawful action — starting with Gaza and the wider regional crisis."
    />

    <meta property="og:title" content="Arbor Sentinel — Building public infrastructure against genocide and mass atrocities." />
    <meta
      property="og:description"
      content="Evidence for protection. Action for accountability. Starting with Gaza and the wider regional crisis."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data — Organization + WebSite. No claims beyond what the
         site publishes; corrected via the /corrections route. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Arbor Sentinel",
            "url": "https://arborsentinel.org",
            "description": "Open-source civic-technology platform for organizing verified public evidence, tracking legal and political responsibility, and helping people take lawful action — starting with Gaza and the wider regional crisis.",
            "logo": "/social-preview.png"
          },
          {
            "@type": "WebSite",
            "name": "Arbor Sentinel",
            "url": "https://arborsentinel.org",
            "description": "Verified evidence. Lawful pressure. Civilian protection."
          }
        ]
      }
    </script>

    <!--
      Backward-compatible redirect: the app uses hash-based routing
      (#/admin/login), but users may arrive with old-style query-string
      URLs (?/admin/login) from bookmarks, links, or the GitHub Pages
      404 fallback. Convert ?/path → #/path before React mounts so
      HashRouter reads the correct route.
    -->
    <script>
      (function () {
        var s = window.location.search;
        if (!s) return;
        // Match ?/path or ?/path&other=value patterns
        var m = s.match(/^\?(\/[^&]*)/);
        if (!m) return;
        var route = m[1];
        // Preserve trailing query params that aren't part of the route
        var rest = s.slice(m[0].length); // e.g. &return=foo
        window.location.replace(
          window.location.pathname + '#' + route + rest + window.location.hash
        );
      })();
    </script>
    <!-- Fonts are self-hosted via @fontsource — no external font requests. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
